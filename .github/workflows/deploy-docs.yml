name: Deploy docs
on:
  # Called by publish.yml after a successful npm publication and by ci.yml after CI passes on
  # main without touching packages/core or packages/cli. Both deploy production.
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build and deploy
        required: true
        type: string
  # Manual redeploy, from main or from a release tag:
  #   gh workflow run deploy-docs.yml --ref main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level, because a called workflow's workflow-level concurrency is not applied.
    concurrency:
      group: deploy-docs-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Refuse deploys that are not from main or a release tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "The docs site deploys from main or a release tag; got $GITHUB_REF from $GITHUB_EVENT_NAME" >&2
          exit 1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler is a devDependency of apps/docs, so the action finds it there instead of installing one.
          workingDirectory: apps/docs
          packageManager: pnpm
          command: pages deploy dist --project-name=eoria --branch=main --commit-hash=${{ inputs.ref || github.sha }} --commit-dirty=false
