name: Conventional commits
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/;
            if (!conventional.test(title)) {
              core.setFailed('Use a Conventional Commit title, such as "feat(button): add icon-only size" or "fix(cli): keep local edits on add". See CONTRIBUTING.md.');
            }
